<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta content="ie=edge" http-equiv="X-UA-Compatible">
  <title>User Profile</title>
  <style>
    .profile-picture {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
    }
    
    .profile-header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .profile-header h1 {
      margin-left: 20px;
    }
  </style>
</head>
<body>
<header>
  <nav class="navbar border-bottom">
    <div class="container grid">
      <c-brand-name></c-brand-name>
      
      <c-breadcrumb title="<%= htmlWebpackPlugin.options.title %>"></c-breadcrumb>
      
      <div class="g-col-4">
        <a href="profile.html">
          <button class="btn" id="profile"
                  style="width: 48px; height: 48px; padding: 0;"
                  type="button">
            <i class="bi bi-person fs-2"></i>
          </button>
        </a>
      </div>
    </div>
  </nav>
</header>

<main>
  <div class="container">
    <c-profile-photo imageUrl="https://images.unsplash.com/photo-1463453091185-61582044d556?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" name="John Doe"></c-profile-photo>
    
    <form class="needs-validation" id="profileForm" novalidate>
      <div class="mb-3">
        <label class="form-label" for="fullName">Full Name</label>
        <input class="form-control" id="fullName" required type="text" value="John Doe">
        <div class="invalid-feedback">Full name is required.</div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" id="email" required type="email" value="johndoe@example.com">
        <div class="invalid-feedback">Valid email is required.</div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="phone">Phone</label>
        <input class="form-control" id="phone" type="tel" value="+1234567890">
        <div class="invalid-feedback">Phone number is required.</div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="bio">Bio</label>
        <textarea class="form-control" id="bio" rows="3">Lorem ipsum dolor sit amet.</textarea>
        <div class="invalid-feedback">Bio is required.</div>
      </div>
      <button class="btn btn-primary" type="submit">Save Changes</button>
    </form>
  </div>
</main>

<c-footer></c-footer>
</body>
</html>
