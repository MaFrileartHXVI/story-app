<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story App - Register</title>
</head>
<body class="bg-light">
  
  <nav-bar></nav-bar>

  <main class="container" style="margin-top: 80px;">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-5">
        <div class="story-form mt-5">
          <h2 class="text-center mb-4 font-weight-bold">Daftar Akun</h2>
          <form id="registerForm" class="needs-validation" novalidate>
            <div class="mb-3">
              <label for="name" class="story-form__label form-label">Nama Lengkap</label>
              <input type="text" class="form-control" id="name" required placeholder="John Doe">
              <div class="invalid-feedback">Silakan masukkan nama Anda.</div>
            </div>

            <div class="mb-3">
              <label for="email" class="story-form__label form-label">Email</label>
              <input type="email" class="form-control" id="email" required placeholder="name@example.com">
              <div class="invalid-feedback">Silakan masukkan email yang valid.</div>
            </div>
            
            <div class="mb-4">
              <label for="password" class="story-form__label form-label">Password</label>
              <password-input id="password"></password-input>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 py-2" id="registerBtn">Daftar</button>
            <div class="text-center mt-3">
              <span class="text-muted">Sudah punya akun?</span> <a href="/auth/login.html" class="text-decoration-none">Masuk di sini</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>
  
  <footer-bar></footer-bar>
</body>
</html>
